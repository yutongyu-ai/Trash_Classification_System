name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Cache torchvision pretrained weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: torch-weights-resnet18-imagenet1k-v1
      - run: pytest -m "not integration"

  integration-test:
    runs-on: ubuntu-latest
    # Informational only — a temporary HF Hub outage shouldn't block a PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Cache torchvision pretrained weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: torch-weights-resnet18-imagenet1k-v1
      - name: Cache Hugging Face Hub downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-trashnet-resnet18
      - run: pytest -m integration

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend
      - run: docker build ./frontend
      - name: Build single-container image (Cloud Run / HF Spaces paid plan)
        run: docker build .
