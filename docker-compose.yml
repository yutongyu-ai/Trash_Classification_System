services:

  backend:
    build:
      context: ./backend
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./checkpoints:/checkpoints
      - hf-cache:/root/.cache/huggingface
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: streamlit_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000/predict
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    restart: always

volumes:
  # Caches the HF Hub checkpoint download across container restarts.
  hf-cache: